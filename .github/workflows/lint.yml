name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}:${{ github.ref }}:lint
      cancel-in-progress: true
    uses: matt-riley/matt-riley-ci/.github/workflows/nvim-lint.yml@e802c1e932579d1e840f6dd4f8316458d1f96983 # v4
